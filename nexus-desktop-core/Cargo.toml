[package]
name = "nexus-desktop-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Pure logic shared by the Nexus Desktop shell: URL normalization, health parsing, navigation policy, update scheduling"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
